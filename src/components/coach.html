<div id="page-coach" class="hidden min-h-screen bg-slate-50 pb-16">
  <header class="bg-anam-blue text-white px-4 py-3.5 shadow-md sticky top-0 z-30">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div>
        <div class="font-extrabold text-sm">Portal Pelatih — Anam</div>
        <div id="coach-greeting" class="text-[11px] text-sky-200">Absensi & Assesment Latihan</div>
      </div>
      <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-xs font-bold">
        Keluar
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 space-y-4">
    <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
      <div class="flex gap-2">
        <button id="coach-tab-murid" onclick="setTabCoach('murid')" class="flex-1 py-2 rounded-xl bg-anam-blue text-white text-xs font-bold transition">
          🏊‍♂️ Daftar Murid
        </button>
        <button id="coach-tab-log" onclick="setTabCoach('log')" class="flex-1 py-2 rounded-xl bg-slate-100 text-slate-600 text-xs font-bold transition">
          📋 Log Assesment
        </button>
      </div>
      <input type="text" id="coach-cari-murid" oninput="handleSearchCoach()" placeholder="🔍 Cari nama murid..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-anam-blue" />
    </div>

    <div id="coach-list-murid" class="space-y-2.5">
      <p class="text-center text-xs text-slate-400 py-8">Memuat daftar murid...</p>
    </div>

    <div id="coach-list-log" class="hidden space-y-2.5">
      <p class="text-center text-xs text-slate-400 py-8">Memuat log assesment...</p>
    </div>
  </main>
</div>
